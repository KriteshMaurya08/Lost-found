# ====================================================================
# Campus Lost & Found Management System - Application Configuration
# ====================================================================

spring.application.name=campus-lost-and-found
server.port=8080

# --------------------------------------------------------------------
# MySQL Database Connection (Direct JDBC)
# --------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/campus_lost_found?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=CampusLostFoundHikariPool

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging for JDBC and SQL queries (Helps during College Viva Demo)
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
logging.level.com.campus.lostfound=DEBUG

# JWT Configuration
jwt.secret=9a7c6e4d2b1f8a0e3d5c7b9a1f3e5d7c9b1a3f5e7d9c1b3a5f7e9d1c3b5a7f9e
jwt.expiration-ms=86400000
